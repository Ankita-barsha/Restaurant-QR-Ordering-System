<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover so the dark ground reaches under the notch and the
         home indicator, rather than leaving white bars on an iPhone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Paints the browser chrome to match the page, so a phone scrolling the
         hero does not show a white address bar above a black page. -->
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="color-scheme" content="dark" />

    <title>Aurelia — Fine Dining</title>
    <meta
      name="description"
      content="A seasonal menu built around fire, patience and produce picked the same morning. Scan the code at your table to order."
    />

    <!-- Opens full-screen when saved to a phone's home screen. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aurelia" />

    <meta property="og:title" content="Aurelia — Fine Dining" />
    <meta
      property="og:description"
      content="Scan, order, and let the kitchen do the rest."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
